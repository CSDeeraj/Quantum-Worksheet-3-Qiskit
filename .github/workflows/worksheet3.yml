name: Worksheet 3 - Quantum Computing

on:
  push:
    paths:
      - "worksheet3/**"
      - ".github/workflows/worksheet3.yml"
  workflow_dispatch:

concurrency:
  group: worksheet3
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-notebooks:
    runs-on: ubuntu-latest

    steps:

      # ============================================
      # 1. Checkout repository
      # ============================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      # ============================================
      # 2. Synchronize with latest main
      #    BEFORE modifying any notebooks
      # ============================================
      - name: Sync with latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      # ============================================
      # 3. Set up Python
      # ============================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # ============================================
      # 4. Install dependencies
      # ============================================
      - name: Install dependencies
        working-directory: worksheet3
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ============================================
      # 5. Execute ALL notebooks
      #    --inplace saves outputs INSIDE the files
      # ============================================
      - name: Execute all notebooks
        working-directory: worksheet3
        run: |
          set -e

          for notebook in *.ipynb; do
            echo "=============================================="
            echo "Executing: $notebook"
            echo "=============================================="

            jupyter nbconvert \
              --to notebook \
              --execute \
              --inplace \
              --ExecutePreprocessor.timeout=600 \
              "$notebook"
          done

      # ============================================
      # 6. Commit executed notebooks
      # ============================================
      - name: Commit executed notebooks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add worksheet3/*.ipynb

          if git diff --cached --quiet; then
            echo "No notebook changes to commit."
            exit 0
          fi

          git commit -m "Execute Worksheet 3 notebooks [skip ci]"

      # ============================================
      # 7. Push notebooks back to GitHub
      # ============================================
      - name: Push executed notebooks
        run: |
          git push origin main
