name: Worksheet 3 - Quantum Computing

on:
  push:
    paths:
      - "worksheet3/**"
      - ".github/workflows/worksheet3.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-notebooks:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Set up Python
      # --------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # --------------------------------------------------
      # 3. Install dependencies
      # --------------------------------------------------
      - name: Install dependencies
        working-directory: worksheet3
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --------------------------------------------------
      # 4. Execute all notebooks IN PLACE
      #    This saves outputs directly into the .ipynb files
      # --------------------------------------------------
      - name: Execute all notebooks
        working-directory: worksheet3
        run: |
          for notebook in *.ipynb; do
            echo "=============================================="
            echo "Executing: $notebook"
            echo "=============================================="

            jupyter nbconvert \
              --to notebook \
              --execute \
              --inplace \
              --ExecutePreprocessor.timeout=600 \
              "$notebook"
          done

      # --------------------------------------------------
      # 5. Commit the executed notebooks
      # --------------------------------------------------
      - name: Commit executed notebooks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add worksheet3/*.ipynb

          if git diff --cached --quiet; then
            echo "No notebook changes to commit."
          else
            git commit -m "Execute Worksheet 3 notebooks [skip ci]"
            git push
          fi
